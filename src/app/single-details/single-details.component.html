<div class="body">
    <div class="container">
        <div class="content">
            <div class="topImage">
                <div class="mainImage">
                    
                            <img [src]="Project.society_images[selectedImage].url" alt="Go realtors Projects on dwarka expressway">
                        
                <!-- <swiper-container class="mySwiper" #swiper (slidechange)="slideChange($event)" pagination="true" navigation="true" direction="horizontal">
                    <ng-container *ngFor="let data of Project.allImages">
                        <swiper-slide>
                                <img [src]="data.image" alt="Go realtors Projects on dwarka expressway">
                                
                            </swiper-slide>
                        </ng-container>
                      </swiper-container> -->
                </div>
                <div class="allImages">
                    <img [src]="data.url" height="80px" width="90px" alt="Raheja atharva images" *ngFor="let data of Project.society_images;let i = index" (click)="selectImage(i)" [ngStyle]="{'border':selectedImage === i ? '2px solid gray' : '2px solid transparent'}">
                </div>
            </div>

            <div class="title">
                <div class="name">{{Project.society_name}}</div>
                <div class="location">
                    <img src="https://icons-for-free.com/iconfiles/png/512/map+marker-1325051861362825518.png" height="20px" width="40px">
                    <div class="text">
                        {{Project.society_location}}
                    </div>
                </div>

            </div>

            <div class="amenities">
                <div class="container">
                    <div class="amentitytitle">Exclusive amenities</div>
                    <div class="text">Explore state-of-art amenities</div>
                    <div class="data">
                        <div class="card" *ngFor="let amentity of Project.society_amenities">
                            <div class="image">
                                <img [src]="'assets/' + amentity.type" alt="amentity image">
                            </div>
                            <div class="name">{{amentity.name}}</div>
                        </div>
                    </div>
                </div>

            </div>

            <div class="amenities availableFlats">
                <div class="container">
                    <div class="amentitytitle">Available Flats</div>
                    <!-- <div class="text">click to view details</div> -->
                    <div class="data">
                        <div class="flatCard" *ngFor="let flat of Project.society_available_flats">
                            <div class="image">
                                <img [src]="flat.flat_image" alt="Flat Layout">
                            </div>
                            <div class="bottom">
                                <div class="name line">
                                    <div class="left">
                                        Flat Type
                                    </div>
                                    <div class="right">
                                        {{flat.flat_name}}
                                    </div>
                                </div>
                                <div class="size line">
                                    <div class="left">
                                        Flat Size (Sq.ft.)
                                    </div>
                                    <div class="right">
                                        {{flat.flat_size}}
                                    </div>
                                </div>
                                <div class="price line">
                                    <div class="left">
                                        Flat Price
                                    </div>
                                    <div class="right">
                                        Rs. {{flat.flat_price}}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="footer">
                <app-contact></app-contact>
            </div>
        </div>
    </div>
</div>
